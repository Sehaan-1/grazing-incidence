[package]
name = "grazing-incidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A ray tracer in Rust: diffuse, metal and dielectric materials, depth of field, and a hand-rolled PNG encoder. Zero dependencies."
license = "MIT"

[dependencies]
# Intentionally empty, and it stays that way. Every algorithm this crate needs
# -- the PRNG, the PPM and PNG encoders, argument parsing, error types -- is
# written here rather than pulled in. See README.md.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1